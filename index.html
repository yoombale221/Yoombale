<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Yoombale Sénégal</title><style>body{margin:0;font-family:system-ui;background:#f6f6f6}header{background:#008751;color:white;padding:20px;text-align:center}header h1{margin:0}.stats{background:#fff8d6;padding:10px;text-align:center;font-weight:bold;color:#7a5a00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1)}.card img{width:100%;height:140px;object-fit:cover}.card div{padding:10px}.price{color:#008751;font-weight:bold}.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:5px}</style></head><body><header><h1>Yoombale 🇸🇳</h1><p>Le Marché Général du Sénégal - Guédiawaye</p></header><div class="stats">👁️ Visiteurs: <span id="count">1255</span> | Livraison Dakar</div><div class="grid" id="products"></div><script>let c=localStorage.getItem('yoombale_visits');c=c?parseInt(c)+1:1255;localStorage.setItem('yoombale_visits',c);document.getElementById('count').textContent=c;const WHATSAPP_NUM="221000000000";const produits=[{nom:"Poulets de Chair",cat:"Volaille",desc:"1.5-2kg bien nourris",prix:"3500 FCFA/kg",image:"https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=500"},{nom:"Fruits Secs Premium",cat:"Fruits Secs",desc:"Mix 1kg anacarde amandes",prix:"8000 FCFA",image:"https://images.unsplash.com/photo-1508061253366-f7da158b6d46?w=500"},{nom:"Vache Laitière",cat:"Bétail",desc:"Sur devis",prix:"Sur devis",image:"https://images.unsplash.com/photo-1527153857715-3908f2bae5e8?w=500"},{nom:"Riz Local 25kg",cat:"Agroalimentaire",desc:"Vallée qualité sup",prix:"15000 FCFA",image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"},{nom:"Panneau Solaire 300W",cat:"Solaire",desc:"Garantie 25 ans",prix:"95000 FCFA",image:"https://images.unsplash.com/photo-1509391366360-2e959784a276?w=500"},{nom:"Ciment 50kg",cat:"Construction",desc:"Dangote",prix:"3500 FCFA",image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500"}];const cont=document.getElementById('products');produits.forEach(p=>{cont.innerHTML+=`<div class="card"><img src="${p.image}"><div><h3>${p.nom}</h3><p>${p.cat}</p><p>${p.desc}</p><p class="price">${p.prix}</p><a class="btn" href="https://wa.me/${WHATSAPP_NUM}?text=Salam je veux ${p.nom}" target="_blank">WhatsApp</a></div></div>`});</script></body></html>
