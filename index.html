<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoombale - Marché Sénégal</title>
<style>
body{font-family:system-ui;margin:0;background:#f7f7f7;color:#222}
header{background:#008751;color:white;padding:15px;text-align:center;position:sticky;top:0}
.counter{background:#fff3cd;color:#856404;padding:8px;text-align:center;font-weight:bold;border-bottom:2px solid #ffeeba}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:130px;object-fit:cover}
.card div{padding:10px}
.card h3{margin:0 0 5px;font-size:15px}
.card p{margin:3px 0;font-size:13px;color:#555}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:8px;border-radius:8px;text-decoration:none;margin-top:8px;font-weight:bold}
footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>
<body>
<header>
<h1 style="margin:0">Yoombale 🇸🇳</h1>
<p style="margin:5px 0 0">Le Marché Général du Sénégal</p>
</header>

<div class="counter">👁️ Visiteurs : <span id="count">0</span> | 🛒 Livraison partout à Dakar</div>

<div class="grid" id="products"></div>

<footer>© 2026 Yoombale - Contact WhatsApp: +221 XX XXX XX XX</footer>

<script>
let c = localStorage.getItem('yoombale_visits');
c = c ? parseInt(c)+1 : 1247;
localStorage.setItem('yoombale_visits', c);
document.getElementById('count').textContent = c.toLocaleString('fr-FR');

const produits = [
{"nom":"Poulets de Chair","prix":"3500 FCFA / kg","image":"https://images.unsplash.com/photo-1548550023-2bdb3c5beed7","cat":"Volaille","desc":"Poulets bien nourris, 1.5-2kg"},
{"nom":"Fruits Secs - Mix Premium 1kg","prix":"8000 FCFA","image":"https://images.unsplash.com/photo-1608797178948-2d1d5c4b2d4f","cat":"Fruits Secs","desc":"Anacarde, amandes, raisins secs"},
{"nom":"Vache Laitière","prix":"Sur devis","image":"https://images.unsplash.com/photo-1527153857715-3908f2bae5e8","cat":"Bétail","desc":"Vaches en bonne santé"}
];

const grid = document.getElementById('products');
produits.forEach(p=>{
 grid.innerHTML+=`
 <div class="card">
  <img src="${p.image}">
  <div>
   <h3>${p.nom}</h3>
   <p>📦 ${p.cat}</p>
   <p>${p.desc}</p>
   <p style="color:#008751;font-weight:bold">${p.prix}</p>
   <a class="btn" href="https://wa.me/221000000000?text=Salem,%20je%20veux%20commander%20${encodeURIComponent(p.nom)}">WhatsApp</a>
  </div>
 </div>`;
});
</script>
</body>
</html>
