<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoombalé - Marché Agricole Sénégal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f6f6f3;color:#1a1a1a}
header{background:#0a7a3e;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:130px;object-fit:cover}
.card-body{padding:10px}
.price{color:#0a7a3e;font-weight:bold;font-size:16px}
.btn{width:100%;background:#0a7a3e;color:white;border:none;padding:10px;border-radius:8px;margin-top:8px;font-weight:bold}
.badge{font-size:11px;background:#e8f5e9;color:#0a7a3e;padding:3px 8px;border-radius:20px}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none}
</style>
</head>
<body>
<header>
<h1>🌾 YOOMBALÉ</h1>
<p>Marché Général du Sénégal- Malika- Guédiawaye</p>
</header>

<div style="padding:20px;text-align:center;background:white;margin:10px;border-radius:12px">
<h2 style="color:#0a7a3e">Produits Frais de la Ferme</h2>
<p style="font-size:13px;margin-top:6px">Livraison Dakar & Guédiawaye - Paiement à la livraison</p>
</div>

<div class="products" id="products"></div>

<a class="whatsapp" href="https://wa.me/221784417720 765658308" target="_blank">W</a>

<script>
const produits = [
  {
    nom: "Poulets de Chair",
    prix: "4500 FCFA / kg",
    image: "https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=400",
    cat: "Volaille",
    desc: "Poulets bien nourris, élevés localement. 1.5kg - 2kg"
  },
  {
    nom: "Vache / Boeuf sur pied",
    prix: "750 000 FCFA",
    image: "https://images.unsplash.com/photo-1527153857715-3908f2bae5e8?w=400",
    cat: "Bétail",
    desc: "Vache Bovines / boeuf - Tabaski & élevage"
  },
  {
    nom: "Oeufs Frais - Plateau 30",
    prix: "3000 FCFA",
    image: "https://images.unsplash.com/photo-1484251931219-f44c11dbf4e9?w=400",
    cat: "Oeufs",
    desc: "Plateau de 30 oeufs frais du jour"
  }
];

const container = document.getElementById('products');
produits.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <img src="${p.image}" alt="${p.nom}">
      <div class="card-body">
        <span class="badge">${p.cat}</span>
        <h3>${p.nom}</h3>
        <p style="font-size:11px;color:#666;margin:4px 0">${p.desc}</p>
        <div class="price">${p.prix}</div>
        <button class="btn" onclick="commander('${p.nom}')">Commander sur WhatsApp</button>
      </div>
    </div>
  `;
});

function commander(nom){
  const msg = `Salam Yoombalé! Je veux commander: ${nom}. Je suis à Guédiawaye.`;
  window.open(`https://wa.me/221700000000?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
